<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141a27">
  <meta name="description" content="J.Codagnoni — computer engineering.">
  <title>J.Codagnoni — Terminal</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <main class="terminal" aria-label="J.Codagnoni terminal homepage">
    <header><span class="window-controls" aria-hidden="true"><i></i><i></i><i></i></span><span>j.codagnoni — /home/visitor</span><span class="shell-label">bash</span></header>
    <div class="session">
      <p class="command"><span class="user">visitor</span><span class="muted">@</span><span class="host">j.codagnoni</span><span class="muted">:~$</span> cat /etc/motd</p>
      <section class="motd" aria-label="Message of the day">
        <h1>Welcome to <span>J.Codagnoni</span><span class="muted">.</span></h1>
        <p>Computer engineering.</p>
      </section>
      <div class="connections"><span class="muted">Find me:</span><a href="https://github.com/codagnoni">github <span aria-hidden="true">↗</span></a><a href="https://www.linkedin.com/in/joao-codagnoni">linkedin <span aria-hidden="true">↗</span></a></div>
      <div id="history" role="log" aria-live="polite" aria-label="Terminal output"></div>
      <form id="prompt" class="command final-prompt" autocomplete="off">
        <label for="command-input"><span class="user">visitor</span><span class="muted">@</span><span class="host">j.codagnoni</span><span class="muted">:~$</span></label>
        <input id="command-input" name="command" autofocus aria-label="Terminal command. Type ls to list links or help for commands." spellcheck="false" autocapitalize="off" autocomplete="off">
      </form>
    </div>
  </main>
</body>
</html>
